# Selected projects shown on the homepage, in this order (the row fits three).
# Rebuild after editing: npm run build:index
#
# Fields:
#   title  project name
#   video  Google Drive share link (…/file/d/<ID>/view?usp=sharing);
#          leave empty to show a placeholder. Share as "Anyone with the link".
#   image  optional thumbnail, path from the site root (e.g. content/halo.png);
#          without it, Drive's own thumbnail is used
#   text   one or two sentences; inline markdown (**bold**, [link](url)) works
#
# A value containing ": " (colon + space) breaks YAML. Quote it, or for text use:
#   text: >-
#     Sentence with a colon: like this, indented under the key.

