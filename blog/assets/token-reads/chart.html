<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokens written vs. tokens read</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#7a7974;
  --grid:#e6e5e1; --iso:#cfcdc7; --pre:#2a78d6; --post:#eb6834; --tip:#ffffff; --tip-b:#dddcd7;
}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-size:30px;line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
.lede{max-width:66ch;color:var(--ink-2);margin:8px 0 0}
.poem{display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.poem .zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:18px;letter-spacing:.12em;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:16px}
.legend{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.scroll{overflow-x:auto}
svg{display:block;min-width:560px;width:100%;height:auto}
svg text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.tick{fill:var(--ink-3);font-size:11px;font-family:"JetBrains Mono",monospace!important}
.axis-t{fill:var(--ink-2);font-size:12px;font-weight:600}
.lbl{fill:var(--ink);font-size:12px}
.iso-l{fill:var(--ink-3);font-size:10.5px;font-style:italic}
.pt{cursor:pointer}
.pt:focus{outline:none}
.pt:focus circle.dot,.pt:hover circle.dot{r:7}
#tip{position:fixed;pointer-events:none;background:var(--tip);border:1px solid var(--tip-b);border-radius:8px;padding:10px 12px;font-size:12.5px;max-width:300px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:5}
#tip b{display:block;font-size:13px;margin-bottom:4px}
#tip .num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
#tip .src{color:var(--ink-2);margin-top:6px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.notes h2{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.notes p,.notes li{margin:0;color:var(--ink-2);font-size:14px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
details summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;font-size:12.5px;width:100%;margin-top:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.n{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
th{color:var(--ink-2);font-weight:600}

.fig{padding:4px 0}
</style></head><body>
<div class="fig">
    <div class="legend">
      <span><i class="sw" style="background:var(--pre)"></i>Canonical pre-LLM work</span>
      <span><i class="sw" style="background:var(--post)"></i>AI-generated, post-LLM</span>
      <span><i class="sw" style="border:2.5px solid var(--pre);width:6px;height:6px"></i>Typical pre-LLM work</span>
      <span>Whiskers show low–high estimates</span>
      <span>Diagonals: every dot on a line was read that many times</span>
    </div>
    <div class="scroll"><svg id="chart" viewBox="0 0 960 600" role="img" aria-label="Log-log scatter of tokens authored versus lifetime token-reads"></svg></div>
  </div>
<div id="tip" hidden></div>
<script>
const D=[
 ["poem","pre","寻隐者不遇 (Tang poem)",20,1e9,1e10,5e10,"r","Tokens measured with o200k, punctuation excluded.","About 700M PRC pupils since the poem entered textbooks × ~15 recitations each, plus pre-modern readers."],
 ["birthday","pre","Happy Birthday to You",20,1e11,5e11,2e12,"r","Lyrics measured with o200k.","Guinness: most recognised English song. ~1B sung birthdays a year × ~100 years × a few listeners. Speculative."],
 ["bach","pre","Bach Cello Suite No. 1, Prelude",672,5e8,2e9,1e10,"r","Note events (~42 bars × 16 sixteenths), not text tokens.","Yo-Yo Ma's recording alone has ~411M Spotify streams. Scaled up for all recordings, platforms, film and live performance."],
 ["hamlet","pre","Hamlet",47663,1e8,3e8,1e9,"l","Measured with o200k (Gutenberg #1524).","School reading, performances and screen adaptations over 400 years. Estimate."],
 ["pp","pre","Pride and Prejudice",170260,2e7,6e7,2e8,"r","Measured with o200k (Gutenberg #1342).",">20M copies sold × ~3 readers per copy."],
 ["hp1","pre","Harry Potter and the Philosopher's Stone",103105,1.2e8,2.4e8,5e8,"a","76,944 words × 1.34 tokens per word.","~120M copies sold × ~2 readers per copy."],
 ["bible","pre","Bible (KJV)",1144344,1e8,5e8,2e9,"l","Measured with o200k (Gutenberg #10).","5–7B copies printed (Guinness), counted as full-read equivalents, assuming a few % of each copy gets read."],
 ["letter","pre","Personal letter (typical)",400,1,2,5,"a","About 300 words.","The recipient, plus a re-read or two.",1],
 ["tang","pre","Typical Tang poem (median of 《全唐诗》)",40,1e2,1e3,1e4,"br","A 律诗 is 40–56 characters; ~1 token per character.","《全唐诗》 holds ~48,900 poems, and most sit outside the anthologies and textbooks. Speculative.",1],
 ["novel","pre","Typical 19th-c. novel (Moretti's \"great unread\")",230000,5e2,5e3,2e4,"r","A three-decker is ~170k words × 1.34 tokens per word.","Print runs of 1,000 or fewer, read mostly through circulating libraries (~5–10 readers per copy).",1],
 ["news","pre","Newspaper article (typical daily)",1070,1e3,1.5e4,1e5,"r","About 800 words.","30k circulation × ~2.5 readers per copy × ~20% who read a given article. Estimate.",1],
 ["email","post","AI-drafted email",200,0.2,0.7,1,"l","About 150 words.","One recipient. Average marketing open rate is ~43% (HubSpot); 1:1 work mail is higher."],
 ["chat","post","Chatbot answer",400,0.1,0.5,1,"b","About 300 words (assumed typical).","Read at most once by the person who asked, and often skimmed. ChatGPT handles ~2.5B prompts a day."],
 ["reasoning","post","Reasoning trace",2000,0.001,0.01,0.05,"r","Assumed typical length.","Hidden or summarized by default, so almost never read in full."],
 ["tweet","post","AI-written X post",40,5,20,60,"l","About 30 words.","Free accounts get ~60 impressions per post (a tenth of Premium's ~600). Impressions overstate reads."],
 ["linkedin","post","AI-written LinkedIn post",260,30,150,840,"r","About 200 words.","Median post gets 840 impressions (AuthoredUp 2026), 225 under 1k followers. Assumes ~20% of impressions are reads."],
 ["blog","post","AI SEO blog post",1800,0.1,3,50,"r","~1,400 words × 1.34 tokens per word.","96.55% of pages get zero Google traffic (Ahrefs). Lifetime reads come mostly from direct and social traffic."],
 ["kdp","post","AI-generated Kindle book",40000,1,10,200,"r","~30,000 words × 1.34 tokens per word.","AI-heavy titles are 20% of the catalogue and 12% of sales (arXiv 2607.20349). No per-title median reported; estimate."]
].map(r=>({id:r[0],era:r[1],name:r[2],tok:r[3],lo:r[4],mid:r[5],hi:r[6],pos:r[7],tb:r[8],rb:r[9],typ:!!r[10]}));

const svg=document.getElementById('chart'),NS="http://www.w3.org/2000/svg";
const W=960,H=600,m={l:78,r:24,t:20,b:56};
const X0=1,X1=7,Y0=0,Y1=16;
const sx=v=>m.l+(Math.log10(v)-X0)/(X1-X0)*(W-m.l-m.r);
const sy=v=>H-m.b-(Math.log10(v)-Y0)/(Y1-Y0)*(H-m.t-m.b);
const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const sup=n=>{const s="⁰¹²³⁴⁵⁶⁷⁸⁹";return (n<0?"⁻":"")+String(Math.abs(n)).split("").map(d=>s[d]).join("")};

// clip region
const defs=el('defs',{});const cp=el('clipPath',{id:'plot'},defs);
el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b},cp);

// grid
for(let i=X0;i<=X1;i++){el('line',{x1:sx(10**i),x2:sx(10**i),y1:m.t,y2:H-m.b,stroke:'var(--grid)'});
  const t=el('text',{x:sx(10**i),y:H-m.b+18,'text-anchor':'middle',class:'tick'});t.textContent='10'+sup(i);}
for(let i=Y0;i<=Y1;i+=1){ if(i%2) continue;
  el('line',{x1:m.l,x2:W-m.r,y1:sy(10**i),y2:sy(10**i),stroke:'var(--grid)'});
  const t=el('text',{x:m.l-8,y:sy(10**i)+4,'text-anchor':'end',class:'tick'});t.textContent='10'+sup(i);}
el('text',{x:(m.l+W-m.r)/2,y:H-12,'text-anchor':'middle',class:'axis-t'}).textContent='Tokens authored (per work)';
el('text',{x:18,y:(m.t+H-m.b)/2,'text-anchor':'middle',class:'axis-t',transform:`rotate(-90 18 ${(m.t+H-m.b)/2})`}).textContent='Lifetime token-reads (tokens × reads)';

// iso-lines: y = r * x
const g=el('g',{'clip-path':'url(#plot)'});
[[1e-2,'read 0.01×'],[1,'read 1×'],[1e3,'read 1K×'],[1e6,'read 1M×'],[1e9,'read 1B×'],[1e12,'read 1T×']].forEach(([r,l])=>{
  el('line',{x1:sx(10),y1:sy(10*r),x2:sx(1e7),y2:sy(1e7*r),stroke:'var(--iso)','stroke-width':1},g);
  // label near right edge, or top edge if the line exits there
  let xe=1e7; if(1e7*r>10**Y1) xe=10**Y1/r;
  const lx=10**(Math.log10(xe)-0.7), ang=Math.atan2(sy(lx*r)-sy(xe*r),sx(lx)-sx(xe));
  const px=sx(lx),py=sy(lx*r)-5;
  const t=el('text',{x:px,y:py,class:'iso-l','text-anchor':'middle',transform:`rotate(${ang*180/Math.PI+180} ${px} ${py})`},g);t.textContent=l;
});

// points
const tip=document.getElementById('tip');
const fmt=v=>v>=1e12?(v/1e12).toPrecision(2)+'T':v>=1e9?(v/1e9).toPrecision(2)+'B':v>=1e6?(v/1e6).toPrecision(2)+'M':v>=1e3?(v/1e3).toPrecision(2)+'K':(+v.toPrecision(2)).toString();
const pts=el('g',{});
D.forEach(d=>{
  const c=d.era==='pre'?'var(--pre)':'var(--post)';
  const x=sx(d.tok),y=sy(d.tok*d.mid);
  const p=el('g',{class:'pt',tabindex:0,'aria-label':`${d.name}: ${fmt(d.tok)} tokens, about ${fmt(d.mid)} reads`},pts);
  el('line',{x1:x,x2:x,y1:sy(d.tok*d.lo),y2:sy(d.tok*d.hi),stroke:c,'stroke-width':2,'stroke-linecap':'round','stroke-opacity':.45},p);
  if(d.typ){el('circle',{class:'dot',cx:x,cy:y,r:5.5,fill:'var(--surface)',stroke:c,'stroke-width':2.5},p);}else{el('circle',{class:'dot',cx:x,cy:y,r:5.5,fill:c,stroke:'var(--surface)','stroke-width':2},p);}
  el('circle',{cx:x,cy:y,r:14,fill:'transparent'},p);
  const o={r:[10,4,'start'],l:[-10,4,'end'],a:[0,-12,'middle'],b:[0,20,'middle'],br:[6,20,'start']}[d.pos];
  el('text',{x:x+o[0],y:y+o[1],'text-anchor':o[2],class:'lbl'},p).textContent=d.name.replace(/ \(.*\)$/,'');
  const show=e=>{tip.innerHTML=`<b>${d.name}</b><div class="num">${fmt(d.tok)} tokens · ${fmt(d.mid)} reads (${fmt(d.lo)}–${fmt(d.hi)})</div><div class="num">≈ ${fmt(d.tok*d.mid)} token-reads</div><div class="src">${d.rb}</div>`;tip.hidden=false;move(e)};
  const move=e=>{const r=e.clientX!==undefined?{x:e.clientX,y:e.clientY}:(()=>{const b=p.getBoundingClientRect();return{x:b.right,y:b.top}})();
    const tw=tip.offsetWidth,th=tip.offsetHeight;let lx=r.x+14,ly=r.y+14;if(lx+tw>innerWidth-8)lx=r.x-tw-14;if(ly+th>innerHeight-8)ly=r.y-th-14;tip.style.left=lx+'px';tip.style.top=ly+'px'};
  p.addEventListener('mouseenter',show);p.addEventListener('mousemove',move);p.addEventListener('mouseleave',()=>tip.hidden=true);
  p.addEventListener('focus',()=>show({}));p.addEventListener('blur',()=>tip.hidden=true);
});

</script>
</body></html>
